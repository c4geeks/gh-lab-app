name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run unit tests
        run: npm test
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Cache the dist workspace
        uses: actions/cache@v4
        with:
          path: dist
          key: dist-${{ runner.os }}-${{ hashFiles('index.js') }}
      - name: Package the app
        run: |
          mkdir -p dist
          cp index.js dist/
          tar czf gh-lab-app.tar.gz dist/
      - uses: actions/upload-artifact@v4
        with:
          name: gh-lab-app
          path: gh-lab-app.tar.gz
